<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>近隣1km 飲食店マップ一覧</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
        <h1 class="text-lg font-bold text-slate-800">近隣1km 飲食店マップ</h1>
      </div>
      <button id="open-settings-btn" class="flex items-center space-x-1 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition-colors border border-slate-300">
        <i class="fa-solid fa-key text-slate-500"></i>
        <span>APIキー設定</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    <!-- 操作パネル -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-base font-bold text-slate-800">現在地から半径1km以内の飲食店を検索</h2>
          <p class="text-xs text-slate-500 mt-1">端末のGPS位置情報をもとに、営業時間・標準価格帯・Googleマップリンクを取得します。</p>
        </div>
        <button id="search-btn" class="flex items-center justify-center space-x-2 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-semibold px-6 py-3 rounded-lg shadow transition-all duration-150">
          <i class="fa-solid fa-location-crosshairs"></i>
          <span>現在地で検索する</span>
        </button>
      </div>

      <!-- ステータス・メッセージバー -->
      <div id="status-bar" class="hidden mt-4 p-3 rounded-lg text-sm"></div>
    </div>

    <!-- 結果一覧テーブルエリア -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2 bg-slate-50/50">
        <div class="flex items-center space-x-2">
          <h3 class="font-bold text-slate-700">店舗一覧</h3>
          <!-- モバイル用の横スクロール案内ヒント -->
          <span class="sm:hidden text-[10px] text-slate-400 bg-slate-200/70 px-2 py-0.5 rounded">
            <i class="fa-solid fa-arrows-left-right mr-1"></i>横スクロール可能
          </span>
        </div>
        <span id="result-count" class="text-sm font-medium text-slate-500">未検索</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full min-w-[720px] text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 uppercase text-xs">
              <th class="py-3 px-4 font-semibold w-1/4">店舗名 / ジャンル</th>
              <th class="py-3 px-4 font-semibold w-1/3">営業時間</th>
              <th class="py-3 px-4 font-semibold w-1/4">標準価格帯（目安・平均）</th>
              <th class="py-3 px-4 font-semibold w-1/6 text-center">Googleマップ</th>
            </tr>
          </thead>
          <tbody id="restaurant-table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-map-location-dot text-4xl mb-3 block text-slate-300"></i>
                「現在地で検索する」ボタンを押して検索を開始してください。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    <p>Powered by <a href="http://webservice.recruit.co.jp/" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-600">ホットペッパーグルメ Webサービス</a></p>
  </footer>

  <!-- APIキー設定モーダル -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-key text-orange-500"></i>
          APIキー設定
        </h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500 mb-4 leading-relaxed">
        リクルートWEBサービスで無料発行した「ホットペッパーAPIキー」を入力してください。キーはお使いのブラウザ内（LocalStorage）にのみ安全に保存されます。
      </p>
      <div class="space-y-4">
        <div>
          <label for="api-key-input" class="block text-xs font-semibold text-slate-700 mb-1">ホットペッパー APIキー</label>
          <input type="text" id="api-key-input" placeholder="例: 1234567890abcdef" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
        </div>
        <div class="flex items-center justify-between pt-2">
          <button id="clear-key-btn" class="text-xs text-red-500 hover:text-red-700 underline">キーを削除</button>
          <div class="space-x-2">
            <button id="cancel-modal-btn" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
            <button id="save-key-btn" class="px-4 py-2 text-xs font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow">保存する</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- スクリプト群 -->
  <script src="js/storage.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
